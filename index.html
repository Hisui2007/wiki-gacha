<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7ef">
  <meta name="description" content="日本語版Wikipediaの記事を1件または10件抽選し、冒頭をプレビューできる非公式ツール。">
  <title>記事ガチャ</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f7ef;
      --white: #fffefa;
      --pine: #123a31;
      --deep: #12352b;
      --ink: #19382d;
      --soft: #516459;
      --line: #dce4d8;
      --lime: #e4f881;
      --tint: #ebf1e4;
      --focus: #246e57;
      font-family: "Noto Sans JP", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
      font-weight: 500;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    .wrap { width: min(1120px, calc(100% - 64px)); margin-inline: auto; }
    .masthead { border-bottom: 1px solid var(--line); }
    .masthead-inner { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; font-size: 1.05rem; }
    .brand-mark {
      display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px;
      background: var(--pine); color: var(--lime);
    }
    .source-link { color: var(--soft); font-size: .875rem; text-underline-offset: .28em; }
    .source-link:hover { color: var(--ink); }
    main { padding-block: 32px 44px; }
    .hero {
      position: relative; isolation: isolate; overflow: hidden; display: grid;
      align-items: center; min-height: 432px; border-radius: 28px;
      background: linear-gradient(105deg, var(--pine), #0e362d); color: var(--white);
    }
    .hero-art {
      position: absolute; z-index: -1; inset: 0 0 0 auto; width: 58%; height: 100%;
      object-fit: cover; object-position: 65% center;
      mask-image: linear-gradient(to right, transparent, black 26%);
    }
    .hero-content { position: relative; padding: 60px 0 62px 57px; max-width: 57%; }
    .eyebrow {
      display: flex; align-items: center; gap: 9px; margin: 0 0 18px;
      color: #d3e4cf; font-size: .875rem; font-weight: 700; letter-spacing: .11em;
    }
    .eyebrow::before { content: "✦"; color: var(--lime); font-size: 1rem; letter-spacing: 0; }
    h1 { margin: 0; font-size: clamp(2.9rem, 6.4vw, 5rem); font-weight: 900; line-height: 1.13; letter-spacing: -.08em; white-space: nowrap; }
    h1 span { color: var(--lime); }
    .hero-description { margin: 20px 0 30px; color: #edf3e7; font-size: 1.04rem; line-height: 1.85; text-wrap: pretty; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .draw-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 11px;
      min-height: 55px; padding: 0 22px; border: 1px solid transparent; border-radius: 13px;
      font-size: 1rem; font-weight: 800; transition: background .18s ease, transform .18s ease;
    }
    .draw-button:hover:not([aria-disabled="true"]) { transform: translateY(-2px); }
    .draw-button:focus-visible { outline-color: #fffefa; }
    .primary { background: var(--lime); color: #1d392a; box-shadow: 0 3px 0 #101e19; }
    .primary:hover:not([aria-disabled="true"]) { background: #f0ffa9; }
    .secondary { background: #204c40; color: var(--white); border-color: #769687; }
    .secondary:hover:not([aria-disabled="true"]) { background: #315e4e; }
    .draw-button[aria-disabled="true"] { opacity: .68; cursor: wait; }
    .capsule {
      position: relative; display: inline-block; width: 21px; height: 14px;
      flex: none; border: 1.75px solid currentColor; border-radius: 999px; transform: rotate(-38deg);
    }
    .capsule::before { content: ""; position: absolute; inset: 0 50% 0 0; border-right: 1.75px solid currentColor; background: currentColor; border-radius: 999px 0 0 999px; }
    .capsule.stack { margin-right: 2px; box-shadow: 2px 3px 0 -1px #204c40, 3px 4px 0 -1px currentColor; }
    .results { margin-top: 35px; scroll-margin-top: 22px; }
    .results-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    h2 { margin: 0; font-size: 1.55rem; font-weight: 850; letter-spacing: -.025em; }
    .count { flex: none; margin: 0; border-radius: 999px; background: var(--tint); color: var(--soft); padding: 5px 13px; font-size: .875rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .panel { background: var(--white); border: 1px solid var(--line); border-radius: 21px; }
    .empty {
      min-height: 206px; display: grid; align-content: center; justify-items: center;
      gap: 8px; padding: 22px; text-align: center;
    }
    .empty-icon {
      display: grid; place-items: center; width: 56px; height: 56px;
      border-radius: 16px; margin-bottom: 4px; background: var(--tint); color: #35644f;
    }
    .empty-icon .capsule { width: 25px; height: 16px; }
    .empty strong { font-size: 1rem; }
    .empty p { margin: 0; color: var(--soft); font-size: .9375rem; line-height: 1.65; }
    .spinner { width: 25px; height: 25px; border: 2px solid #a8beae; border-top-color: var(--focus); border-radius: 50%; animation: spin .75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .results-grid { display: grid; gap: 16px; align-items: start; }
    .results-grid.with-list { grid-template-columns: minmax(250px, .9fr) minmax(0, 1.65fr); }
    .list-panel { min-width: 0; overflow: hidden; }
    .list-title { margin: 0; padding: 18px 19px 11px; color: var(--soft); font-size: .875rem; font-weight: 750; }
    .result-list { list-style: none; margin: 0; padding: 0 9px 9px; display: grid; gap: 3px; }
    .result-option {
      width: 100%; min-height: 44px; display: flex; align-items: center; gap: 11px;
      padding: 7px 10px; border-radius: 9px; border: 1px solid transparent;
      background: transparent; color: var(--ink); text-align: left; overflow-wrap: anywhere;
    }
    .result-option:hover { background: #f1f5ec; }
    .result-option[aria-pressed="true"] { background: #e6f0dd; border-color: #b9cfb3; font-weight: 800; }
    .number {
      flex: 0 0 25px; height: 25px; display: grid; place-items: center; border-radius: 8px;
      color: var(--soft); background: var(--tint); font: 700 .8125rem/1 system-ui, sans-serif;
    }
    .result-option[aria-pressed="true"] .number { background: var(--pine); color: var(--white); }
    .article { padding: clamp(20px, 3.4vw, 33px); min-width: 0; }
    .article-label { margin: 0 0 8px; color: #436d55; font-size: .875rem; font-weight: 800; }
    .article h3 { margin: 0 0 12px; font-size: clamp(1.38rem, 3.6vw, 2.1rem); line-height: 1.35; overflow-wrap: anywhere; }
    .extract { margin: 0; font-size: 1rem; line-height: 1.85; white-space: pre-line; overflow-wrap: anywhere; }
    .article-credit { margin: 12px 0 0; color: var(--soft); font-size: .875rem; line-height: 1.7; }
    .article-credit a { text-underline-offset: .2em; }
    .article-actions { margin-top: 22px; }
    .read-button {
      display: inline-flex; align-items: center; min-height: 44px; padding: 8px 15px;
      border-radius: 9px; color: var(--white); background: var(--pine);
      text-decoration: none; font-size: .9375rem; font-weight: 750;
    }
    .read-button:hover { background: #295c4b; }
    .error {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      margin: 0 0 12px; padding: 12px 15px; border: 1px solid #e2c5b2; border-radius: 12px;
      background: #fff4e9; color: #763c26;
    }
    .error p { margin: 0; font-size: .9375rem; }
    .retry { min-height: 40px; background: var(--white); border: 1px solid #d3a98d; border-radius: 8px; padding: 5px 11px; color: #763c26; font-weight: 700; }
    .retry:hover { background: #fce8d8; }
    footer { border-top: 1px solid var(--line); }
    .footer-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 15px; padding-block: 20px 25px; color: var(--soft); font-size: .8125rem; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    noscript { display: block; margin-top: 12px; }
    @media (max-width: 800px) {
      .wrap { width: calc(100% - 40px); }
      .hero-content { padding-left: 37px; max-width: 65%; }
      .draw-button { padding-inline: 16px; }
      .results-grid.with-list { grid-template-columns: minmax(180px, .85fr) minmax(0, 1.4fr); }
    }
    @media (max-width: 630px) {
      .wrap { width: calc(100% - 32px); }
      main { padding-top: 18px; }
      .masthead-inner { min-height: 61px; }
      .hero { display: block; min-height: auto; border-radius: 21px; }
      .hero-content { padding: 30px 23px 26px; max-width: none; }
      .hero-art {
        position: relative; display: block; inset: auto; width: 100%;
        height: auto; max-height: 320px; object-fit: contain; object-position: center;
        mask-image: linear-gradient(to bottom, transparent, black 8%);
      }
      h1 { font-size: clamp(2.55rem, 10vw, 4.2rem); }
      .eyebrow { margin-bottom: 12px; }
      .hero-description { margin: 14px 0 21px; font-size: .97rem; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
      .draw-button { padding-inline: 6px; gap: 8px; min-height: 51px; }
      .results { margin-top: 25px; }
      .results-grid.with-list { grid-template-columns: minmax(0, 1fr); }
      .result-list { max-height: 192px; overflow-y: auto; overscroll-behavior: contain; }
      .empty { min-height: 185px; }
    }
    @media (max-width: 345px) {
      .draw-button { font-size: .875rem; }
      .draw-button .capsule { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>

    <section class="results" aria-labelledby="results-title">
      <div class="results-head">
        <h2 id="results-title" tabindex="-1">抽選結果</h2>
        <p class="count" id="count">0件</p>
      </div>
      <p id="announcement" class="visually-hidden" role="status" aria-atomic="true"></p>
      <div class="error" id="error" hidden>
        <p id="error-message" role="alert"></p>
        <button class="retry" id="retry" type="button">もう一度試す</button>
      </div>
      <div class="panel empty" id="empty">
        <span class="empty-icon" aria-hidden="true">
          <span class="capsule" id="empty-capsule"></span>
          <span class="spinner" id="spinner" hidden></span>
        </span>
        <strong id="empty-title">まだ記事を引いていません</strong>
        <p id="empty-description">上のボタンから最初の記事を引いてみましょう。</p>
      </div>
      <div class="results-grid" id="results-grid" hidden>
        <div class="panel list-panel" id="list-panel" hidden>
          <h3 class="list-title" id="list-title">引いた記事</h3>
          <ol class="result-list" id="result-list" aria-labelledby="list-title"></ol>
        </div>
        <article class="panel article" id="article-preview" aria-labelledby="article-title">
          <p class="article-label">プレビュー</p>
          <h3 id="article-title" tabindex="-1"></h3>
          <p class="extract" id="extract"></p>
          <p class="article-credit" id="article-credit" hidden><a id="article-source" target="_blank" rel="noopener">日本語版Wikipediaの原記事</a>から冒頭を抜粋（<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ja" target="_blank" rel="noopener">CC BY-SA 4.0</a>）</p>
          <div class="article-actions">
            <a id="article-link" class="read-button" target="_blank" rel="noopener"><span>Wikipediaで全文を読む</span><span class="visually-hidden">（新しいタブ）</span></a>
          </div>
        </article>
      </div>
    </section>
  </main>
  <footer>
    <div class="wrap footer-inner">
      <span>日本語版Wikipediaを利用した非公式ツールです。</span>
    </div>
  </footer>
  <script>
    "use strict";

    const wiki = "https://ja.wikipedia.org";
    const api = new URL("/w/api.php", wiki);
    const get = (id) => document.getElementById(id);
    const controls = [...document.querySelectorAll("[data-draw]")];
    const list = get("result-list");
    const grid = get("results-grid");
    const title = get("article-title");
    const resultsHeading = get("results-title");

    let activeDraw = null;
    let busy = false;
    let selectedButton = null;

    async function fetchArticle() {
      const query = new URLSearchParams({
        action: "query",
        format: "json",
        formatversion: "2",
        origin: "*",
        generator: "random",
        grnnamespace: "0",
        grnfilterredir: "nonredirects",
        grnlimit: "1",
        prop: "extracts",
        exintro: "1",
        explaintext: "1",
        exchars: "680"
      });
      const response = await fetch(api + "?" + query, {
        credentials: "omit",
        cache: "no-store",
        signal: AbortSignal.timeout(12000)
      });
      if (!response.ok) throw new Error("Wikipedia HTTP " + response.status);
      const data = await response.json();
      const article = data.query?.pages?.[0];
      if (data.error || !article?.pageid || !article.title) {
        throw new Error(data.error?.code || "Missing article");
      }
      return article;
    }

    function showArticle(article, button) {
      selectedButton?.setAttribute("aria-pressed", "false");
      selectedButton = button;
      button?.setAttribute("aria-pressed", "true");
      title.textContent = article.title;
      const extract = article.extract?.trim();
      const articleUrl = wiki + "/?curid=" + article.pageid;
      get("extract").textContent = extract || "この記事の冒頭は取得できませんでした。全文はWikipediaで読めます。";
      get("article-credit").hidden = !extract;
      get("article-source").href = articleUrl;
      get("article-link").href = articleUrl;
    }

    function appendArticle(article, draw) {
      const index = draw.articles.length;
      if (index === 1) {
        list.replaceChildren();
        selectedButton = null;
        grid.hidden = false;
        grid.classList.toggle("with-list", draw.total > 1);
        get("list-panel").hidden = draw.total === 1;
        get("empty").hidden = true;
      }

      let option = null;
      if (draw.total > 1) {
        const item = document.createElement("li");
        option = document.createElement("button");
        option.type = "button";
        option.className = "result-option";
        option.setAttribute("aria-controls", "article-preview");
        option.setAttribute("aria-pressed", "false");
        const number = document.createElement("span");
        number.className = "number";
        number.textContent = index;
        number.setAttribute("aria-hidden", "true");
        const label = document.createElement("span");
        label.textContent = article.title;
        option.append(number, label);
        option.addEventListener("click", () => {
          showArticle(article, option);
          get("announcement").textContent = article.title + "のプレビューを表示しました。";
          if (matchMedia("(max-width: 630px)").matches) title.focus();
        });
        item.append(option);
        list.append(item);
      }
      if (index === 1) showArticle(article, option);
    }

    function setCount(draw, inProgress) {
      const done = draw.articles.length;
      get("count").textContent = inProgress
        ? done + " / " + draw.total + "件を抽選"
        : done + "件";
    }

    function reachResults(trigger) {
      if (document.activeElement !== trigger && document.activeElement !== document.body) return;
      if (resultsHeading.getBoundingClientRect().top > innerHeight - 230) {
        resultsHeading.focus({preventScroll: true});
        resultsHeading.scrollIntoView({block: "start"});
      }
    }

    async function runDraw(draw, trigger) {
      busy = true;
      activeDraw = draw;
      controls.forEach((button) => button.setAttribute("aria-disabled", "true"));
      get("error").hidden = true;
      if (grid.hidden) {
        get("empty-capsule").hidden = true;
        get("spinner").hidden = false;
        get("empty-title").textContent = "記事を抽選しています";
        get("empty-description").textContent = "Wikipediaに接続しています。";
      }
      setCount(draw, true);
      get("announcement").textContent = "記事の抽選を開始しました。";

      try {
        let repeats = 0;
        while (draw.articles.length < draw.total) {
          const article = await fetchArticle();
          if (draw.seen.has(article.pageid)) {
            if (++repeats === 3) throw new Error("Repeated random article");
            continue;
          }
          draw.seen.add(article.pageid);
          draw.articles.push(article);
          appendArticle(article, draw);
          setCount(draw, true);
          if (draw.articles.length === 1) reachResults(trigger);
        }
        get("announcement").textContent = draw.total === 1
          ? draw.articles[0].title + "のプレビューを表示しました。"
          : draw.total + "件の抽選が完了しました。";
      } catch (error) {
        const remaining = draw.total - draw.articles.length;
        get("error").hidden = false;
        get("error-message").textContent = error.name === "TimeoutError"
          ? "Wikipediaの応答に時間がかかっています。"
          : "記事を取得できませんでした。時間をおいて、もう一度お試しください。";
        get("retry").textContent = draw.articles.length ? "残り" + remaining + "件を引く" : "もう一度試す";
        if (grid.hidden) {
          get("empty-title").textContent = "まだ記事を引いていません";
          get("empty-description").textContent = "通信状態を確認して、もう一度お試しください。";
        }
        reachResults(trigger);
      } finally {
        if (draw.articles.length || grid.hidden) {
          setCount(draw, false);
        } else {
          get("count").textContent = (get("list-panel").hidden ? 1 : list.children.length) + "件";
        }
        get("empty-capsule").hidden = false;
        get("spinner").hidden = true;
        controls.forEach((button) => button.removeAttribute("aria-disabled"));
        busy = false;
      }
    }

    for (const button of controls) {
      button.addEventListener("click", () => {
        if (busy) return;
        runDraw({total: Number(button.dataset.draw), articles: [], seen: new Set()}, button);
      });
    }
    const retry = get("retry");
    retry.addEventListener("click", () => {
      if (busy || !activeDraw) return;
      resultsHeading.focus({preventScroll: true});
      runDraw(activeDraw, resultsHeading);
    });
  </script>
